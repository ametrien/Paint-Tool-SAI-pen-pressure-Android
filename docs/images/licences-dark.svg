<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1100" viewBox="0 0 920 1100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="920" height="1100" fill="#0d1117"/><path d="M460.0 90 V106 H22 V790" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M22 790 H40" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M22 576 H40" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M22 328 H40" fill="none" stroke="#656c76" stroke-width="1.5"/><path d="M22 148 H40" fill="none" stroke="#656c76" stroke-width="1.5"/><rect x="230.0" y="24" width="460" height="66" rx="12" fill="#2a2550" stroke="#8f86d0" stroke-width="1.5"/><text x="460.0" y="52" text-anchor="middle" font-size="18" font-weight="600" fill="#e6edf3">SAI Pen APK</text><text x="460.0" y="75" text-anchor="middle" font-size="14.5" fill="#9198a1">as a whole: GNU GPL 3 with our NOTICE terms</text><rect x="40" y="124" width="840" height="158" rx="10" fill="#151b23" stroke="#3d444d"/><rect x="40" y="124" width="6" height="158" rx="3" fill="#ab7df8"/><text x="64" y="153" font-size="16.5" font-weight="600" fill="#ab7df8">Ours</text><text x="860" y="153" text-anchor="end" font-size="13.5" fill="#9198a1">GPL 3 with our NOTICE terms</text><line x1="64" y1="170" x2="860" y2="170" stroke="#3d444d"/><text x="64" y="192" font-size="14.5" fill="#e6edf3">SAI Pen&#x27;s Java code and patches</text><text x="860" y="192" text-anchor="end" font-size="14.5" fill="#9198a1"></text><line x1="64" y1="204" x2="860" y2="204" stroke="#3d444d"/><text x="64" y="226" font-size="14.5" fill="#e6edf3">wintab32.dll (the pressure driver), winhandler.exe</text><text x="860" y="226" text-anchor="end" font-size="14.5" fill="#9198a1"></text><line x1="64" y1="238" x2="860" y2="238" stroke="#3d444d"/><text x="64" y="260" font-size="14.5" fill="#e6edf3">build scripts and tests</text><text x="860" y="260" text-anchor="end" font-size="14.5" fill="#9198a1"></text><rect x="40" y="304" width="840" height="226" rx="10" fill="#151b23" stroke="#3d444d"/><rect x="40" y="304" width="6" height="226" rx="3" fill="#4493f8"/><text x="64" y="333" font-size="16.5" font-weight="600" fill="#4493f8">Others&#x27; parts: copyleft</text><text x="860" y="333" text-anchor="end" font-size="13.5" fill="#9198a1">source attached to every release</text><line x1="64" y1="350" x2="860" y2="350" stroke="#3d444d"/><text x="64" y="372" font-size="14.5" fill="#e6edf3">Winlator</text><text x="860" y="372" text-anchor="end" font-size="14.5" fill="#9198a1">LGPL 2.1, passed on under the GPL 3</text><line x1="64" y1="384" x2="860" y2="384" stroke="#3d444d"/><text x="64" y="406" font-size="14.5" fill="#e6edf3">Wine, VKD3D-Proton</text><text x="860" y="406" text-anchor="end" font-size="14.5" fill="#9198a1">LGPL 2.1+</text><line x1="64" y1="418" x2="860" y2="418" stroke="#3d444d"/><text x="64" y="440" font-size="14.5" fill="#e6edf3">glibc, GLib, GStreamer, FFmpeg, PulseAudio, GnuTLS, FluidSynth ...</text><text x="860" y="440" text-anchor="end" font-size="14.5" fill="#9198a1">LGPL</text><line x1="64" y1="452" x2="860" y2="452" stroke="#3d444d"/><text x="64" y="474" font-size="14.5" fill="#e6edf3">libmpeg2</text><text x="860" y="474" text-anchor="end" font-size="14.5" fill="#9198a1">GPL 2+</text><line x1="64" y1="486" x2="860" y2="486" stroke="#3d444d"/><text x="64" y="508" font-size="14.5" fill="#e6edf3">GCC runtime</text><text x="860" y="508" text-anchor="end" font-size="14.5" fill="#9198a1">GPL 3 with the runtime exception</text><rect x="40" y="552" width="840" height="192" rx="10" fill="#151b23" stroke="#3d444d"/><rect x="40" y="552" width="6" height="192" rx="3" fill="#3fb950"/><text x="64" y="581" font-size="16.5" font-weight="600" fill="#3fb950">Others&#x27; parts: permissive</text><text x="860" y="581" text-anchor="end" font-size="13.5" fill="#9198a1">notices in LICENSES.txt</text><line x1="64" y1="598" x2="860" y2="598" stroke="#3d444d"/><text x="64" y="620" font-size="14.5" fill="#e6edf3">Box64, Mesa, X11, cnc-ddraw</text><text x="860" y="620" text-anchor="end" font-size="14.5" fill="#9198a1">MIT</text><line x1="64" y1="632" x2="860" y2="632" stroke="#3d444d"/><text x="64" y="654" font-size="14.5" fill="#e6edf3">DXVK, zlib</text><text x="860" y="654" text-anchor="end" font-size="14.5" fill="#9198a1">zlib</text><line x1="64" y1="666" x2="860" y2="666" stroke="#3d444d"/><text x="64" y="688" font-size="14.5" fill="#e6edf3">AndroidX, Oboe, Vulkan loader</text><text x="860" y="688" text-anchor="end" font-size="14.5" fill="#9198a1">Apache 2.0</text><line x1="64" y1="700" x2="860" y2="700" stroke="#3d444d"/><text x="64" y="722" font-size="14.5" fill="#e6edf3">FreeType, libjpeg, libpng, FLAC, Opus ...</text><text x="860" y="722" text-anchor="end" font-size="14.5" fill="#9198a1">their own</text><rect x="40" y="766" width="840" height="90" rx="10" fill="#151b23" stroke="#3d444d"/><rect x="40" y="766" width="6" height="90" rx="3" fill="#d29922"/><text x="64" y="795" font-size="16.5" font-weight="600" fill="#d29922">App icon</text><text x="860" y="795" text-anchor="end" font-size="13.5" fill="#9198a1">not under the GPL</text><line x1="64" y1="812" x2="860" y2="812" stroke="#3d444d"/><text x="64" y="834" font-size="14.5" fill="#e6edf3">“Pen” by gravisio, Flaticon</text><text x="860" y="834" text-anchor="end" font-size="14.5" fill="#9198a1">Flaticon free licence, with credit</text><rect x="40" y="884" width="840" height="192" rx="10" fill="#151b23" stroke="#3d444d" stroke-dasharray="6 5"/><rect x="40" y="884" width="6" height="192" rx="3" fill="#f85149"/><text x="64" y="913" font-size="16.5" font-weight="600" fill="#f85149">Not in the app</text><text x="860" y="913" text-anchor="end" font-size="13.5" fill="#9198a1">left out on purpose</text><line x1="64" y1="930" x2="860" y2="930" stroke="#3d444d"/><text x="64" y="952" font-size="14.5" fill="#e6edf3">PaintTool SAI</text><text x="860" y="952" text-anchor="end" font-size="14.5" fill="#9198a1">proprietary: everyone brings their own copy</text><line x1="64" y1="964" x2="860" y2="964" stroke="#3d444d"/><text x="64" y="986" font-size="14.5" fill="#e6edf3">Microsoft&#x27;s DLLs and fonts</text><text x="860" y="986" text-anchor="end" font-size="14.5" fill="#9198a1">may not be passed on</text><line x1="64" y1="998" x2="860" y2="998" stroke="#3d444d"/><text x="64" y="1020" font-size="14.5" fill="#e6edf3">FDK AAC codec</text><text x="860" y="1020" text-anchor="end" font-size="14.5" fill="#9198a1">not compatible with the GPL</text><line x1="64" y1="1032" x2="860" y2="1032" stroke="#3d444d"/><text x="64" y="1054" font-size="14.5" fill="#e6edf3">Winlator&#x27;s extra programs and winhandler.exe</text><text x="860" y="1054" text-anchor="end" font-size="14.5" fill="#9198a1">no published source</text></svg>
